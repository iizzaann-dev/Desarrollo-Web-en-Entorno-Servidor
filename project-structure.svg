<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title description">
  <title id="title">PHP exercise repository structure</title>
  <desc id="description">A Git repository contains exercise sets, and each set contains individual PHP exercises.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-linecap: round; }
      .small { font-size: 14px; fill: #475569; }
    </style>
  </defs>
  <rect width="1000" height="430" rx="24" fill="url(#background)"/>
  <text x="500" y="43" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">A SIMPLE, SCALABLE REPOSITORY MAP</text>

  <path class="line" d="M500 125 V157 M170 157 H830 M170 157 V185 M500 157 V185 M830 157 V185"/>
  <path class="line" d="M170 258 V290 M500 258 V290 M830 258 V290"/>

  <g filter="url(#shadow)">
    <rect x="370" y="68" width="260" height="58" rx="16" fill="#1d4ed8"/>
    <text x="500" y="105" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">📦  Git repository</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="185" width="230" height="73" rx="15" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="385" y="185" width="230" height="73" rx="15" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="715" y="185" width="230" height="73" rx="15" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
    <text x="170" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">🗂️  Exercise set 01</text>
    <text x="170" y="239" text-anchor="middle" class="small">One assignment, grouped together</text>
    <text x="500" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">🗂️  Exercise set 02</text>
    <text x="500" y="239" text-anchor="middle" class="small">One assignment, grouped together</text>
    <text x="830" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">🗂️  Exercise set ...</text>
    <text x="830" y="239" text-anchor="middle" class="small">Room for what comes next</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="290" width="230" height="95" rx="15" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <rect x="385" y="290" width="230" height="95" rx="15" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <rect x="715" y="290" width="230" height="95" rx="15" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <text x="170" y="321" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">🐘  Individual exercises</text>
    <text x="170" y="348" text-anchor="middle" class="small">exercise-01.php · exercise-02.php</text>
    <text x="170" y="369" text-anchor="middle" class="small">and the next one to solve</text>
    <text x="500" y="321" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">🐘  Individual exercises</text>
    <text x="500" y="348" text-anchor="middle" class="small">exercise-01.php · exercise-02.php</text>
    <text x="500" y="369" text-anchor="middle" class="small">and the next one to solve</text>
    <text x="830" y="321" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">🐘  Individual exercises</text>
    <text x="830" y="348" text-anchor="middle" class="small">exercise-01.php · exercise-02.php</text>
    <text x="830" y="369" text-anchor="middle" class="small">and the next one to solve</text>
  </g>
</svg>
